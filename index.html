<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>綠燈亮起，大湖GO GO！｜大湖資訊競賽 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style id="own-css">
:root{
  --bg:#f3f7fb;--surface:#fff;--ink:#1d2430;--muted:#5b6778;--line:#d9e1ea;
  --road:#262b35;--hero:#2a3fe4;--navy:#0f1538;--yellow:#ffc93c;--green:#1f9d62;--blue:#2f6fdb;--red:#e5484d;
  --tint-g:#e3f5ec;--tint-b:#e4edfc;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d;--surface:#1b212b;--ink:#eef2f7;--muted:#9aa6b6;--line:#2e3744;
  --tint-g:#15352a;--tint-b:#182a4a;--green:#3ec98a;--blue:#6c9bf0;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#12161d;--surface:#1b212b;--ink:#eef2f7;--muted:#9aa6b6;--line:#2e3744;--tint-g:#15352a;--tint-b:#182a4a;--green:#3ec98a;--blue:#6c9bf0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.3;margin:0}
h2{font-size:1.7rem;font-weight:900;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 24px;max-width:36em}
section{padding:48px 0}

/* hero */
.hero{background-color:var(--hero);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(135deg,var(--hero) 0%,#6a2fe0 100%);background-size:28px 28px,28px 28px,auto;color:#fff;padding:44px 0 0;position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:24px;align-items:center}
@media(min-width:760px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.15;font-weight:900;letter-spacing:.02em;text-shadow:4px 4px 0 var(--navy)}
.hero p{margin:16px 0 24px;color:#e3e9ff;max-width:28em}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--yellow);cursor:pointer;font:inherit;font-weight:700;line-height:1.4}
.btn.main{background:var(--yellow);color:#262b35}
.btn.ghost{background:transparent;color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.zebra{height:34px;margin-top:0;background:repeating-linear-gradient(90deg,#f2f2f2 0 38px,transparent 38px 76px)}
.hero svg{width:100%;height:auto;display:block}

/* tracks */
.tracks{display:grid;gap:18px}
@media(min-width:760px){.tracks{grid-template-columns:1fr 1fr}}
.track{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;border-top:8px solid var(--green)}
.track.s{border-top-color:var(--blue)}
.track h3{font-size:1.3rem;font-weight:900}
.who{display:inline-block;margin:8px 0 12px;padding:2px 12px;border-radius:999px;background:var(--tint-g);color:var(--green);font-weight:700;font-size:.9rem}
.track.s .who{background:var(--tint-b);color:var(--blue)}
.track ul{margin:0;padding-left:1.2em}
.track li{margin:4px 0}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:.95rem}
.track{display:flex;flex-direction:column}
.track .who{align-self:flex-start}
.track ul{flex:1}
.track .js-form{align-self:flex-start;margin-top:16px;width:12.5rem;max-width:100%;text-align:center}
.track .when{margin-top:10px;color:var(--muted);font-size:.95rem}


/* track cards v2 */
.track .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.grade{display:inline-block;padding:4px 18px;border-radius:999px;background:var(--tint-g);color:var(--green);font-size:1.4rem;font-weight:900;line-height:1.4;white-space:nowrap}
.track.s .grade{background:var(--tint-b);color:var(--blue)}
.due{flex:none;text-align:center;border:2px solid var(--green);border-radius:12px;overflow:hidden;min-width:104px;background:var(--surface)}
.track.s .due{border-color:var(--blue)}
.due .lb{display:block;background:var(--green);color:var(--surface);font-size:.75rem;font-weight:700;padding:1px 8px;line-height:1.6}
.track.s .due .lb{background:var(--blue)}
.due .dt{display:block;padding:4px 10px 5px;font-size:1.1rem;font-weight:900;line-height:1.3;color:var(--ink)}
.due .dt small{display:block;font-size:.75rem;font-weight:700;color:var(--muted)}
.thead{display:flex;align-items:center;gap:12px;min-width:0}
.track .top{align-items:center}
.track .grade{align-self:flex-start;margin:16px 0 6px}
.thead h3{min-width:0}
.thead .art{width:52px;height:52px;flex:none}
.track ul.info{list-style:none;margin:0;padding:0;flex:1}
.track ul.info li{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 0;border-top:1px solid var(--line)}
.track ul.info .ic{width:20px;height:20px;flex:none;margin-top:3px;stroke:var(--green)}
.track.s ul.info .ic{stroke:var(--blue)}
.track{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr auto;align-items:center}
.track .top{display:contents}
.thead{grid-column:1/-1;grid-row:1;margin:0 0 4px}
.due{grid-column:2;grid-row:2;margin-top:10px}
.track .grade{grid-column:1;grid-row:2;margin:10px 0 0;justify-self:start}
.track ul.info{grid-column:1/-1;grid-row:3;align-self:stretch;margin-top:14px}
.track .js-form{grid-column:1/-1;grid-row:4;justify-self:start;align-self:end}
@media(max-width:639px){.track{display:grid;grid-template-columns:1fr auto;align-items:center}.track .top{display:contents}.thead{grid-column:1/-1;grid-row:1}.due{grid-column:2;grid-row:2;margin-top:10px}.track .grade{grid-column:1;grid-row:2;margin:10px 0 0;justify-self:start}.track ul.info{grid-column:1/-1;margin-top:12px}.track .js-form{justify-self:stretch;align-self:stretch;width:auto}.grade{font-size:1.15rem;padding:4px 14px}.due{min-width:0}.due .dt{padding:4px 8px 5px;font-size:1.05rem}}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:4px dashed var(--line)}
.tl li{position:relative;margin:0 0 18px;padding-left:18px}
.tl li::before{content:"";position:absolute;left:-33px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--yellow);border:3px solid var(--bg)}
.tl li.p::before{background:var(--green)}.tl li.s::before{background:var(--blue)}
.tl b{display:block;font-weight:700}
.tl span{color:var(--muted);font-size:.95rem}
.yr{margin:26px 0 14px -22px;font-weight:900;color:var(--muted)}

/* stages */
.stages{display:grid;gap:16px}
@media(min-width:760px){.stages{grid-template-columns:repeat(3,1fr)}}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px;border-top:8px solid var(--green)}
.stage.s{border-top-color:var(--blue)}
.stage .n{font-size:2.4rem;font-weight:900;line-height:1;color:var(--green)}
.stage.s .n{color:var(--blue)}
.stage.s .who{background:var(--tint-b);color:var(--blue)}
.stage h3{font-size:1.2rem;font-weight:900;margin:2px 0 16px}
.stage dl{margin:0}
.stage dt{font-size:.9rem;color:var(--muted);font-weight:700}
.stage dd{margin:0 0 12px;font-weight:700}

/* task */
.taskgrid{display:grid;gap:26px;align-items:center;margin-top:22px}
@media(min-width:860px){.taskgrid{grid-template-columns:1.05fr 1fr}}
.task{list-style:none;margin:0;padding:0;counter-reset:t}
.task li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;column-gap:14px;align-items:start;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.task li::before{content:counter(t);grid-row:1/3;width:34px;height:34px;border-radius:50%;background:#8fb4ff;color:#0f1538;font-weight:900;display:flex;align-items:center;justify-content:center}
.task b{grid-column:2;display:block;line-height:1.5;color:#fff}
.task span{grid-column:2;color:#d5dcf5;font-size:.95rem;line-height:1.65}
.task li.logic{border-color:#ffab19;background:rgba(255,171,25,.16)}
.task li.logic::before{background:#ffab19;color:#3a2600}

/* timeline: continuous line from first dot to last dot */
.tg{display:flow-root}
.tlwrap .tl{border-left:0;padding-left:26px}
.tlwrap .yr{margin:26px 0 14px;padding-left:44px}
.tg:first-child .yr{margin-top:0}
.tl li::before{z-index:1}
.tl li::after{content:"";position:absolute;left:-26px;top:15px;bottom:-33px;width:0;border-left:4px dashed var(--line)}
.tg:first-child .tl li:last-child::after{bottom:-101px}
.tg:last-child .tl li:last-child::after{display:none}
@media(min-width:860px){
  .tlwrap{display:flex;align-items:flex-start}
  .tl li::after{display:none}
  .tg:nth-child(1){flex:2}.tg:nth-child(2){flex:4}
  .tlwrap .yr{margin:0 0 16px;padding-left:0}
  .tlwrap .tl{display:flex;padding:0}
  .tl li{flex:1;margin:0;padding:24px 14px 0 0;border-top:4px solid var(--line)}
  .tl li::before{left:0;top:-11px}
  .tg:last-child .tl li:last-child{border-top-color:transparent}
}
/* news */
.news{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.news li{display:grid;gap:6px 16px;grid-template-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
@media(min-width:640px){.news li{grid-template-columns:120px 1fr}}
@media(max-width:639px){
  .news li{grid-template-columns:auto 1fr;align-items:center;column-gap:10px}
  .news li>div{display:contents}
  .news li>div>.tag{grid-column:2;grid-row:1;margin:0;justify-self:start}
  .news li>div>b,.news li>div>p,.news li>div>.del{grid-column:1/-1}
  .news li>div>.del{justify-self:start}
}
.news time{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.news .tag{display:inline-block;margin-right:8px;padding:0 10px;border-radius:999px;background:var(--tint-b);color:var(--blue);font-size:.85rem;font-weight:700}
.news .tag.g{background:var(--tint-g);color:var(--green)}
.news p{margin:4px 0 0;color:var(--muted);font-size:.95rem}

/* pie */
.piebox{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pie{width:150px;height:150px;border-radius:50%;flex:none;box-shadow:0 0 0 4px var(--surface)}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:160px;align-self:stretch;display:flex;flex-direction:column;justify-content:space-around}
@media(min-width:480px){.piebox{flex-wrap:nowrap}}
.legend li{display:flex;align-items:center;gap:8px;margin:0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto}
.pie{display:none}
.donut{display:block;flex:none;width:170px;height:auto}
.piebox{margin-top:20px;gap:24px}
.legend{align-self:center;justify-content:flex-start}
.legend li{padding:9px 2px;border-bottom:1px solid var(--line)}
.legend li:last-child{border-bottom:0}
.legend b{font-size:1.05rem}
@media(max-width:479px){
  .score .card{padding:22px 18px}
  .piebox{flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-top:26px}
  .donut{width:100%;max-width:190px;margin:0 auto}
  .legend{width:100%;max-width:300px;min-width:0;flex:none}
}
/* scoring */
.score{display:grid;gap:18px}
@media(min-width:760px){.score{grid-template-columns:1fr 1fr}}
@media(orientation:landscape) and (max-height:500px) and (min-width:480px){
  .score{grid-template-columns:1fr}
  .piebox{justify-content:center;gap:36px}
  .legend{flex:none;width:340px;min-width:0}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.bar{margin:12px 0}
.bar div.l{display:flex;justify-content:space-between;font-size:.95rem}
.bar div.t{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar div.t i{display:block;height:100%;background:var(--green)}
.card.s .bar div.t i{background:var(--blue)}

/* form */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;gap:10px;margin-bottom:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:.9rem;font-weight:700;margin-bottom:2px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.entry{border:1px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.entry h4{margin:0 0 8px;font-size:.95rem}
.msg{min-height:1.6em;font-weight:700}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
textarea{min-height:170px;resize:vertical}
.hide{display:none}
.small{color:var(--muted);font-size:.9rem}
footer{background:var(--navy);color:#c9d2de;padding:28px 0;text-align:center;font-size:.95rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* admin */
.admin-link{background:none;border:0;color:#c9d2de;font:inherit;font-size:.85rem;opacity:.7;cursor:pointer;text-decoration:underline;margin-left:14px}
#admin textarea{min-height:90px}
#admin h3{margin:0 0 12px}
#admin .btns{margin-top:12px}
.news .del{margin-top:8px;border:1px solid var(--line);background:none;color:var(--red);border-radius:999px;padding:2px 14px;font:inherit;font-size:.85rem;cursor:pointer}

/* event card header: title row 1, small grade row 2, due box spans both on the right */
.track{column-gap:14px}
.thead{grid-column:1;grid-row:1;margin:0;align-self:end}
.track .grade{grid-column:1;grid-row:2;margin:8px 0 0;padding:2px 14px;font-size:1rem;line-height:1.5;align-self:start;justify-self:start}
.due{grid-column:2;grid-row:1/3;align-self:stretch;margin:0;display:flex;flex-direction:column;width:8rem;min-width:0}
.due .dt{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}

/* equal due boxes */
.due{height:5rem}
@media(max-width:480px){.thead .art{width:40px;height:40px}.thead h3{font-size:1.15rem}.due{width:6.9rem}.due .dt{font-size:1rem;padding:4px 6px}}
/* mobile: slightly looser line spacing in the two event cards */
@media(max-width:639px){.track ul.info li{line-height:1.95;padding:12px 0}}
/* mobile: shorter hero */
@media(max-width:759px){
  .hero{padding-top:40px}
  .hero .wrap{gap:20px}
  .hero .wrap>div:first-child{padding-bottom:21px!important}
  .hero h1{font-size:clamp(2.8rem,12.6vw,4rem);line-height:1.14}
  .hero p{margin:13px 0 20px;font-size:1.4rem!important}
  .hero svg{max-width:330px!important}
  .zebra{height:32px}
}
</style>
</head>

     +'<p class="msg" id="a-msg" role="status"></p>'
     +'<div class="btns"><button class="btn main" id="a-add" type="button">新增公告</button>'
     +'<button class="btn" id="a-close" type="button" style="border-color:var(--line);color:var(--ink)">關閉後台</button></div>'
     +'<p class="small" style="margin-bottom:0">要刪除舊公告，請按公告卡片上的「刪除」。</p>';
    $("a-date").value=today();
    $("a-add").onclick=function(){
      var date=$("a-date").value,title=$("a-title").value.trim(),text=$("a-text").value.trim();
      if(!date)return setMsg("請選擇日期。",true);
      if(!title)return setMsg("請填寫標題。",true);
      var item={id:Date.now().toString(36),date:date,tag:$("a-tag").value,title:title,text:text};
      save({news:[item].concat(state.news)});
    };
    $("a-close").onclick=function(){isAdmin=false;box.classList.add("hide");renderNews()};
  }

  async function openAdmin(){
    var box=$("admin");box.classList.remove("hide");
    box.textContent="檢查權限中…";
    box.scrollIntoView({block:"center"});
    var denied="這個帳號沒有管理權限。請用管理員帳號登入後，再開啟這個頁面。";
    try{
      if(typeof claude==="undefined")throw 0;
      var user=await claude.use("user");
      var can=user?await user.canEdit():false;
      if(!can){box.textContent=denied;return}
      ns=await claude.use("artifact");
      if(!ns){box.textContent=denied;return}
      isAdmin=true;renderNews();showForm();
    }catch(e){box.textContent=denied}
  }
  $("adminBtn").onclick=openAdmin;
  try{if(sessionStorage.getItem("dahuAdmin")==="1"){sessionStorage.removeItem("dahuAdmin");openAdmin()}}catch(e){}
})();</script>
</body>
</html>
